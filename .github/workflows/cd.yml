name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-peerly-fe
  cancel-in-progress: false

env:
  IMAGE_NAME: peerly-fe
  REGISTRY: ghcr.io/artemkarapetian

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - env: stage
            api_url: https://api-stage.prly.ru/api
          - env: prod
            api_url: https://api.prly.ru/api
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build & push (${{ matrix.env }})
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-${{ matrix.env }}"
          docker build --build-arg VITE_API_URL=${{ matrix.api_url }} -t "$IMAGE" .
          docker push "$IMAGE"

  deploy-k3s:
    needs: build-push
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        env: [stage, prod]
    steps:
      - name: Checkout peerly-manifests
        uses: actions/checkout@v4
        with:
          repository: peerly-team/peerly-manifests
          token: ${{ secrets.MANIFESTS_PAT }}
          path: manifests

      - name: Bump frontend-${{ matrix.env }} image tag
        run: |
          cd manifests
          VALUES_FILE=values/frontend-${{ matrix.env }}.yaml
          TAG=${{ github.sha }}-${{ matrix.env }}
          sed -i "s|^  tag: .*|  tag: $TAG|" "$VALUES_FILE"
          git config user.email "ci-bot@peerly.local"
          git config user.name "peerly-ci-bot"
          if git diff --quiet "$VALUES_FILE"; then
            echo "no change"
            exit 0
          fi
          git add "$VALUES_FILE"
          git commit -m "${{ matrix.env }}(frontend): bump image to $TAG"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          echo "::error::failed to push after 3 attempts"
          exit 1
