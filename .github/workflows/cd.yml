name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-peerly-fe
  cancel-in-progress: false

env:
  IMAGE_NAME: peerly-fe
  REGISTRY: ghcr.io/artemkarapetian

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build --build-arg VITE_API_URL=https://api-stage.prly.ru/api -t "$IMAGE" .

      - name: Push image
        run: docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

  deploy-k3s-stage:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout peerly-manifests
        uses: actions/checkout@v4
        with:
          repository: peerly-team/peerly-manifests
          token: ${{ secrets.MANIFESTS_PAT }}
          path: manifests

      - name: Bump frontend-stage image tag
        run: |
          cd manifests
          sed -i "s|^  tag: .*|  tag: ${{ github.sha }}|" values/frontend-stage.yaml
          git config user.email "ci-bot@peerly.local"
          git config user.name "peerly-ci-bot"
          if git diff --quiet values/frontend-stage.yaml; then
            echo "no change"
            exit 0
          fi
          git add values/frontend-stage.yaml
          git commit -m "stage(frontend): bump image to ${{ github.sha }}"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          echo "::error::failed to push after 3 attempts"
          exit 1

  deploy-k3s-prod:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout peerly-manifests
        uses: actions/checkout@v4
        with:
          repository: peerly-team/peerly-manifests
          token: ${{ secrets.MANIFESTS_PAT }}
          path: manifests

      - name: Bump frontend-prod image tag
        run: |
          cd manifests
          sed -i "s|^  tag: .*|  tag: ${{ github.sha }}|" values/frontend-prod.yaml
          git config user.email "ci-bot@peerly.local"
          git config user.name "peerly-ci-bot"
          if git diff --quiet values/frontend-prod.yaml; then
            echo "no change"
            exit 0
          fi
          git add values/frontend-prod.yaml
          git commit -m "prod(frontend): bump image to ${{ github.sha }}"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          echo "::error::failed to push after 3 attempts"
          exit 1
