name: CI

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  quality:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  test:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Run tests with coverage
        run: npm run test:coverage -- --reporter=default --coverage.reporter=text --coverage.reporter=lcov --coverage.reporter=json-summary

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7

  diff-coverage:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install diff-cover
        run: pip install "diff-cover>=9,<10"

      - name: Fetch base ref
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Run diff-cover
        run: |
          diff-cover coverage/lcov.info \
            --compare-branch origin/${{ github.base_ref }} \
            --fail-under=50 \
            --html-report coverage/diff-cover.html \
            --markdown-report coverage/diff-cover.md

      - name: Upload diff-cover report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diff-cover-report
          path: coverage/diff-cover.html
          retention-days: 7

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  cypress-ct:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Cache Cypress binary
        id: cypress-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Cypress binary
        if: steps.cypress-cache.outputs.cache-hit != 'true'
        run: npx cypress install

      - name: Cypress component tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          component: true
          browser: chrome

  build:
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  bundle-size:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download PR build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Measure PR bundle size
        id: pr
        run: |
          EAGER=$(find dist/assets -maxdepth 1 -type f \( -name "index-*.js" -o -name "vendor*.js" \) -printf "%s\n" | awk '{sum+=$1} END {print sum+0}')
          LAZY=$(find dist/assets -maxdepth 1 -type f -name "*.js" ! -name "index-*.js" ! -name "vendor*.js" -printf "%s\n" | awk '{sum+=$1} END {print sum+0}')
          echo "eager=$EAGER" >> "$GITHUB_OUTPUT"
          echo "lazy=$LAZY"   >> "$GITHUB_OUTPUT"
          echo "PR eager JS: $(echo "scale=2; $EAGER/1024" | bc) KB"
          echo "PR lazy JS:  $(echo "scale=2; $LAZY/1024" | bc) KB"

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache main node_modules
        uses: actions/cache@v4
        with:
          path: main-branch/node_modules
          key: node-modules-main-${{ hashFiles('main-branch/package-lock.json') }}

      - name: Install & build main for bundle baseline (best-effort)
        working-directory: main-branch
        run: |
          npm ci --ignore-scripts 2>/dev/null || true
          npm run build 2>/dev/null || true

      - name: Compare bundle sizes
        run: |
          PR_EAGER=${{ steps.pr.outputs.eager }}
          PR_LAZY=${{ steps.pr.outputs.lazy }}

          if [ ! -d "main-branch/dist/assets" ]; then
            echo "No main build to compare, skipping"
            exit 0
          fi

          MAIN_EAGER=$(find main-branch/dist/assets -maxdepth 1 -type f \( -name "index-*.js" -o -name "vendor*.js" \) -printf "%s\n" 2>/dev/null | awk '{sum+=$1} END {print sum+0}')
          MAIN_LAZY=$(find main-branch/dist/assets -maxdepth 1 -type f -name "*.js" ! -name "index-*.js" ! -name "vendor*.js" -printf "%s\n" 2>/dev/null | awk '{sum+=$1} END {print sum+0}')

          if [ "$MAIN_EAGER" = "0" ]; then
            echo "Main has no eager JS, skipping comparison"
            exit 0
          fi

          fmt_kb() { echo "scale=2; $1/1024" | bc; }
          pct() { echo "scale=2; (($1 - $2) / $2) * 100" | bc; }

          EAGER_DELTA=$(pct "$PR_EAGER" "$MAIN_EAGER")
          echo "Eager (initial load):  $(fmt_kb $MAIN_EAGER) KB → $(fmt_kb $PR_EAGER) KB (${EAGER_DELTA}%)"

          if [ "$MAIN_LAZY" -gt "0" ]; then
            LAZY_DELTA=$(pct "$PR_LAZY" "$MAIN_LAZY")
            echo "Lazy  (on-demand):     $(fmt_kb $MAIN_LAZY) KB → $(fmt_kb $PR_LAZY) KB (${LAZY_DELTA}%)"
          else
            echo "Lazy  (on-demand):     n/a → $(fmt_kb $PR_LAZY) KB"
          fi

          EAGER_OVER=$(echo "$EAGER_DELTA > 10" | bc)
          if [ "$EAGER_OVER" = "1" ]; then
            echo "::error::Eager bundle grew by ${EAGER_DELTA}% (max 10%) — investigate before merging"
            exit 1
          fi

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          configPath: .lighthouserc.json
